<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="1500" height="640" fill="#07090e"/>
  <rect width="1500" height="640" fill="url(#brand)" opacity="0.03"/>

  <text x="750" y="48" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">NearMiss — Pipeline Architecture</text>
  <text x="750" y="74" text-anchor="middle" fill="#8292a6" font-size="14">Real FLUID drone footage in → a verified, human-auditable near-miss record out</text>

  <!-- Stage 1: Input -->
  <g>
    <rect x="40" y="130" width="230" height="150" rx="14" fill="#0e1420" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="40" y="130" width="230" height="6" rx="3" fill="#64748b"/>
    <text x="155" y="168" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">FLUID drone footage</text>
    <text x="155" y="192" text-anchor="middle" fill="#8292a6" font-size="11.5">3 sessions · ~57 min · 4K</text>
    <text x="155" y="212" text-anchor="middle" fill="#8292a6" font-size="11.5">~390 ft (~120 m) altitude</text>
    <text x="155" y="232" text-anchor="middle" fill="#8292a6" font-size="11.5">RTK-validated trajectories</text>
    <text x="155" y="256" text-anchor="middle" fill="#475569" font-size="10.5" font-style="italic">source dataset, not ours</text>
  </g>

  <!-- Stage 2: SAM 3.1 -->
  <g>
    <rect x="330" y="130" width="250" height="150" rx="14" fill="#0e1420" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="330" y="130" width="250" height="6" rx="3" fill="#3b82f6"/>
    <text x="455" y="168" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">Meta SAM 3.1</text>
    <text x="455" y="192" text-anchor="middle" fill="#8292a6" font-size="11.5">Perception layer</text>
    <text x="455" y="214" text-anchor="middle" fill="#8292a6" font-size="11.5">Pedestrian / vehicle</text>
    <text x="455" y="232" text-anchor="middle" fill="#8292a6" font-size="11.5">segmentation &amp; tracking</text>
    <text x="455" y="256" text-anchor="middle" fill="#475569" font-size="10.5" font-style="italic">validated separately;</text>
    <text x="455" y="270" text-anchor="middle" fill="#475569" font-size="10.5" font-style="italic">this pilot used FLUID's own tracks</text>
  </g>

  <!-- Stage 3: PET engine -->
  <g>
    <rect x="640" y="130" width="250" height="150" rx="14" fill="#0e1420" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="640" y="130" width="250" height="6" rx="3" fill="#64748b"/>
    <text x="765" y="168" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">PET physics engine</text>
    <text x="765" y="192" text-anchor="middle" fill="#8292a6" font-size="11.5">Deterministic, no ML</text>
    <text x="765" y="214" text-anchor="middle" fill="#8292a6" font-size="11.5">Post-Encroachment Time</text>
    <text x="765" y="232" text-anchor="middle" fill="#8292a6" font-size="11.5">per ped×vehicle pair</text>
    <text x="765" y="256" text-anchor="middle" fill="#475569" font-size="10.5" font-style="italic">critical / serious / moderate</text>
  </g>

  <!-- Stage 4: Muse Spark -->
  <g>
    <rect x="950" y="130" width="260" height="150" rx="14" fill="#0e1420" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="950" y="130" width="260" height="6" rx="3" fill="#a855f7"/>
    <text x="1080" y="168" text-anchor="middle" fill="#d8b4fe" font-size="15" font-weight="700">Meta Muse Spark 1.3</text>
    <text x="1080" y="192" text-anchor="middle" fill="#8292a6" font-size="11.5">Visual review layer</text>
    <text x="1080" y="214" text-anchor="middle" fill="#8292a6" font-size="11.5">Looks at 7 real rendered</text>
    <text x="1080" y="232" text-anchor="middle" fill="#8292a6" font-size="11.5">frames, confirms / flags</text>
    <text x="1080" y="256" text-anchor="middle" fill="#475569" font-size="10.5" font-style="italic">independent of PET label</text>
  </g>

  <!-- Stage 5: Mission Deck -->
  <g>
    <rect x="1270" y="105" width="190" height="200" rx="14" fill="#0e1420" stroke="#f8fafc" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="1270" y="105" width="190" height="6" rx="3" fill="url(#brand)"/>
    <text x="1365" y="140" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Mission Deck</text>
    <text x="1365" y="162" text-anchor="middle" fill="#8292a6" font-size="11">Cockpit · Radar · Ledger</text>
    <text x="1365" y="180" text-anchor="middle" fill="#8292a6" font-size="11">Review Queue · Reports</text>
    <text x="1365" y="202" text-anchor="middle" fill="#8292a6" font-size="11">Engineer / Enforcement /</text>
    <text x="1365" y="218" text-anchor="middle" fill="#8292a6" font-size="11">Resident views</text>
    <text x="1365" y="240" text-anchor="middle" fill="#475569" font-size="10.5" font-style="italic">every number traces to</text>
    <text x="1365" y="254" text-anchor="middle" fill="#475569" font-size="10.5" font-style="italic">a real DB row above</text>
    <text x="1365" y="280" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">AI pattern insight</text>
    <text x="1365" y="294" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">(Spark, grounded)</text>
  </g>

  <!-- forward arrows -->
  <line x1="270" y1="205" x2="325" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="205" x2="635" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="205" x2="945" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1210" y1="205" x2="1265" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- human review loop (back from Mission Deck to DB, shown as a lower loop) -->
  <path d="M 1365 305 C 1365 400, 220 420, 155 420 C 110 420, 95 390, 95 330 L 95 280"
        fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arrowAccent)"/>
  <text x="730" y="455" text-anchor="middle" fill="#c4b5fd" font-size="12.5" font-weight="600">Human review loop — Review Queue decisions (confirm / dismiss / escalate) write back to the same SQLite record</text>

  <!-- DB bar under everything -->
  <rect x="40" y="520" width="1420" height="60" rx="10" fill="#0b0f18" stroke="#1e293b"/>
  <text x="60" y="555" fill="#8292a6" font-size="13" font-weight="700">nearmiss.db</text>
  <text x="200" y="555" fill="#475569" font-size="12">— one row per candidate pair: PET · severity · Spark status/flags/observation · evidence frames · human review state. Nothing in the UI is computed outside this table.</text>

  <!-- stage connector down to db -->
  <line x1="155" y1="280" x2="155" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="455" y1="280" x2="455" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="765" y1="280" x2="765" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="1080" y1="280" x2="1080" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="1365" y1="305" x2="1365" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,4"/>

  <text x="750" y="615" text-anchor="middle" fill="#475569" font-size="11.5">Meta Global AI Developer Hackathon 2026 · Indie track · NearMiss</text>
</svg>
